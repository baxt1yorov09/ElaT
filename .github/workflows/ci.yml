name: CI

on:
  push:
    branches: [main]
  pull_request:

# Independent jobs per sub-project. Path filters keep a backend change from
# rebuilding the app and vice versa.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'elat-backend/**'
              - '.github/workflows/ci.yml'
            app:
              - 'elat-app/**'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elat-backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: elat
          POSTGRES_USER: elat
          POSTGRES_PASSWORD: elat
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U elat"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-insecure-test-key
      DATABASE_URL: postgis://elat:elat@localhost:5432/elat
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install GDAL (GeoDjango)
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format check)
        run: ruff format --check .
      - name: Mypy (types)
        run: mypy apps config
      - name: Migrations check
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest -q --cov=apps --cov-report=term-missing

  app:
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elat-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Analyze
        run: dart analyze
      - name: Format check
        # Only check tracked sources; generated l10n (lib/l10n/generated) is
        # gitignored and must not fail the format gate.
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart')
      - name: Tests
        run: flutter test
